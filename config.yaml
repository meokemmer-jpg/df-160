# DF-160 OPS-Calendar-Density-Monitor Meeting-Load-Tracker [CRUX-MK]
# Welle: 25 (Skeleton-Wave-2 W51-B)
# Domain: OPS (Operational Calendar-Hygiene, L_Martin)

df_id: DF-160
df_name: ops-calendar-density-monitor
welle: 25
domain: OPS
status: SKELETON-CONDITIONAL
crux-mk: true

mission: |
  Calendar-Meeting-Density-Tracking. Tracking Meetings-per-Day, Total-Meeting-Hours-per-Week,
  Deep-Work-Block-Count, Back-to-Back-Meetings-Count. NIEMALS Meetings buchen oder loeschen.

# K11-K16
k11_cascade_isolation: hard
failure_blast_radius: 0
dependency_dlq_strategy: "Eigenes State-File, append-only Calendar-Log"

k12_distillation_resistenz:
  output_feeds_into_training: false
  provenance_required_in_output: true
  non_llm_validation_layer: true

k13_independent_ground_truth:
  external_anchor_type: filesystem
  external_anchor_validation_frequency: per_run
  pre_action_domain_check: true
  pre_action_backup_check: false
  pre_action_blast_radius_check: true

k14_human_override_decay:
  override_complexity: single_command
  override_documentation_freshness_days: 30
  martin_review_cadence: weekly  # L_Martin-relevant
  bus_factor_handover_drilled: false

k15_entropy_budget:
  entropy_added_loc_estimate: 180
  entropy_added_concepts:
    - Calendar-Density-Tracking
    - Deep-Work-Block-Detection
    - Back-to-Back-Detection
  entropy_justified_by_rho:
    rho_low_eur_per_year: 4000
    rho_high_eur_per_year: 18000
    rho_confidence: PROVISIONAL

k16_concurrent_spawn_protection: both
lock_dir: /tmp/df-160.lock
lock_stale_age_h: 6
engine_pgrep_check: true
lock_release_on: EXIT_INT_TERM

# LC1-LC5
lose_coupling:
  LC1_graceful_degradation:
    degradation_modes:
      - full
      - degraded_anchor
      - standalone
    degradation_test_required: true
  LC2_direct_mode:
    direct_mode_available: true
    direct_mode_capability: 0.85
    direct_mode_trigger: "DF_160_REAL_API_ENABLED=false"
  LC3_circuit_breaker:
    circuit_breaker_timeout_s: 30
    circuit_breaker_open_threshold: 3
    circuit_breaker_half_open_test_interval_s: 300
  LC4_failure_isolation:
    state_externalization: true
    idempotent_operations: true
    dependency_dlq_separate: false
  LC5_health_check:
    health_check_dependencies: []
    health_check_degraded_score: 0.7
    health_check_endpoint_or_file: branch-hub/state/df-160-health.json

default_action:
  description: "Mock-Mode: lese Calendar-Export-Files, aggregiere Density-Metriken, NIEMALS Calendar-Mutation"
  rho_per_run_eur: 40
  block_gates:
    - gate_id: K11
      block_reason: "Cascade-Containment fuer Read-Only-Pipeline"
      false_block_cost_eur: 5
      legitimate_block_condition: "Cascade-Trigger detektiert"
  graceful_degradation_path: "Mock-Fallback (empty Calendar-Log)"

activation_gates:
  DF_160_REAL_API_ENABLED:
    default: false
    description: "Real-Read Google Calendar / Outlook API"
    requires_phronesis_ticket: true
  DF_160_ENV:
    default: dev

q0_sperr_liste:
  - id: Q0-1
    rule: "Calendar-Event-Create oder Delete oder Modify"
    enforcement: "DF hat KEINE Calendar-Write-API"
  - id: Q0-2
    rule: "Decision-Empfehlungen produzieren"
    enforcement: "Decision-Keyword-RegEx"

rho_estimate:
  annual_eur: 10000
  reason: "Calendar-Density-Audit-Automation, Deep-Work-Schutz fuer Martin L_Martin"
  schwer_quantifizierbar: true

migration_provenance:
  source_welle: 25
  pre_skeleton_engine_loc: 180
  reference_pattern: df-145
  skeleton_created: 2026-05-13

trinity_compliance:
  options_presented_in_spec: true
  variants:
    - conservative: "Mock-Mode default"
    - aggressive: "DF_160_REAL_API_ENABLED=true (Calendar-API-Phase-2)"
    - contrarian: "DF-160 sunset wenn Calendar-Insights nativ vorhanden"

crux_bindung:
  K_0: "n/a"
  Q_0: "L_Martin Deep-Work-Schutz + Familien-Zeit-Schutz"
  I_min: "strukturierte K11-K16 + LC1-LC5"
  W_0: "Martin-Bandwidth-Visibility ueber Meeting-Load"

